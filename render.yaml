services:
  - type: web
    name: smartpark-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: cp prisma/schema.postgresql.prisma prisma/schema.prisma && npm install && npx prisma generate && npx prisma db push && node scripts/seed.js && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartpark-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: smartpark-db
    plan: free
    databaseName: smartpark
    user: smartpark_user
